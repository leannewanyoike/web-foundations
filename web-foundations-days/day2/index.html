<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quicknotes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Quicknotes</h1>
        <p>Capture ideas before they disappear</p>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
        </nav>
    </header>
    
    <main>
        <section>
            <h2>Add a note</h2>
            <form id="note-form">
                <label for="note-input">New note</label>
                <input type="text" id="note-input" placeholder="Type a note...">
                <button type="submit">Add Note</button>
            </form>
        </section>

        <section>
            <h2>Your notes</h2>
            <p id="note-count">You have 2 notes.</p>
            <ul id="note-list">
                <li>Revise HTML forms</li>
                <li>Push my code to Github</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Quicknotes. Build during Web Foundation</p>
    </footer>
</body>
</html>
