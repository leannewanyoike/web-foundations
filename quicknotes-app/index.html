<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - Capture Ideas Before They Disappear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <h1 class="app-title">QuickNotes</h1>
            <p class="app-tagline">Capture ideas before they disappear</p>
        </div>
    </header>

    <main class="app-main">
        <!-- Section 1: Add a note -->
        <section class="card-section add-section" aria-labelledby="add-heading">
            <h2 id="add-heading" class="section-title">Add a note</h2>
            <form id="note-form" novalidate>
                <div class="form-group form-group-input">
                    <label for="note-input">Note text</label>
                    <input 
                        type="text" 
                        id="note-input" 
                        name="note-input" 
                        placeholder="What's on your mind? (1-200 characters)" 
                        autocomplete="off">
                </div>

                <div class="form-group form-group-category">
                    <label for="note-category">Category</label>
                    <select id="note-category" name="note-category">
                        <option value="personal">Personal</option>
                        <option value="work">Work</option>
                        <option value="study">Study</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" id="add-btn">Add Note</button>
                </div>
            </form>
            <p id="error-message" class="error-message" role="alert" aria-live="polite"></p>
        </section>

        <!-- Section 2: Your notes -->
        <section class="card-section notes-section" aria-labelledby="notes-heading">
            <div class="notes-header">
                <h2 id="notes-heading" class="section-title">Your notes</h2>
                <div class="search-container">
                    <label for="search-input" class="search-label">Search notes</label>
                    <input 
                        type="search" 
                        id="search-input" 
                        name="search-input" 
                        placeholder="Search notes by keyword or category..." 
                        autocomplete="off">
                </div>
            </div>

            <p id="note-count" class="note-count">You have no notes yet.</p>
            <ul id="note-list" class="notes-list" aria-live="polite"></ul>
        </section>
    </main>

    <footer class="app-footer">
        <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>
</body>
</html>
